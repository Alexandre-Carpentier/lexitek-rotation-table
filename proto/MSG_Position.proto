syntax = "proto3";

message frontend_message
{
    string source = 1;
    string command = 2;
    uint64 timestamp_ms = 3;
}

message backend_response
{
    bool ok = 1;
    double rotation_angle = 2;
    uint64 timestamp_ms = 3;
}

service ReadAngleRPC
{
    rpc SendCommand(frontend_message) returns (backend_response){}

    rpc StartCommand(run) returns (backend_response){}
    rpc StopCommand(stop) returns (backend_response){}
    rpc CalibrateCommand(calibrate) returns (backend_response){}
    rpc HomeCommand(homing) returns (backend_response){}
    rpc WriteCommand(WriteRequest) returns (backend_response){}
    rpc ReadCommand(ReadRequest) returns (backend_response){}
}

message run
{
    string source = 1;
    double frequency = 2;
    uint64 timestamp_ms = 3;
}

message stop
{
    string source = 1;
    uint64 timestamp_ms = 2;
}

message calibrate
{
    string source = 1;
    uint64 timestamp_ms = 2;
}

message homing
{
    string source = 1;
    uint64 timestamp_ms = 2;
}

message WriteRequest
{
    string source = 1;
    double angle = 2;
    uint64 timestamp_ms = 3;
}

message ReadRequest
{
    string source = 1;
    uint64 timestamp_ms = 2;
}
